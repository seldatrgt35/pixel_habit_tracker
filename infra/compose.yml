name: little-by-little
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pixel}
      POSTGRES_DB: ${POSTGRES_DB:-pixel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local POSTGRES_PASSWORD in .env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-55432}:5432'
    volumes:
      - pixel-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    profiles: ['api']
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DOCKER_DATABASE_URL:-}
      DB_POOL_MAX: 5
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      db:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
volumes:
  pixel-data:
